{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss"></style>
    <title>{% block title %} Package App {% endblock %}</title>
</head>
<body class=" bg-blue-500/50">
    
    <div class="flex justify-between items-center h-8 py-5">

    
        <div class="flex items-center">
          <li><a href="/" class="text-center text-2xl">Package App</a> </li>  
        </div>
        
        <div class="hidden md:flex space-x-2 mr-4 space-x-6">
             <a href="" class="text-blue-400 w-14 text-center  font-bold rounded ">Delete</a> 
             <a href="parcels/" class="text-white w-14 text-center  font-bold rounded ">Store</a> 
        </div>

        <div class="md:hidden">
            <button class="text-gray-700">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div> 
    
     
    
    
        {% block content %}
        {% endblock %}

    <footer>
        <p>&copy; 2026 - AWANAX All rights reserved</p>
    </footer>
</body>
</html>
